# HISTORICAL / unused for package version.
# neocom-domain package.json is synced from the latest npm publish
# (`npm run version:sync`). Git tags vX.Y.Z are created after publish to
# follow npm — not the other way around. Do not restore GitVersion as the
# source of truth for this library.
assembly-informational-format: '{FullSemVer}'
mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
ignore:
  sha: []
merge-message-formats: {}
